version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
    # Note: SQLite data lives inside the container's filesystem and will
    # reset on rebuild. For persistence across rebuilds, mount a volume
    # at the exact path shortener.db is created (see database/database.py).

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend